<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTCS Beacon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
:root{color-scheme:light}
body{font-family:'Open Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:#14213D;background:#F3F5F9}
a{color:#1F5FAD}a:hover{color:#14213D}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #1F5FAD;outline-offset:2px}
input[type=range]{accent-color:#1F5FAD}
@media (min-width: 820px){nav[aria-label="Main"]{position:sticky;top:0;height:100vh;align-self:flex-start;overflow-y:auto}}
@media print{nav,header{display:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl-Main">

<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #FFFFFF; font-family: 'Open Sans', system-ui, sans-serif; color: #14213D">

  <section style="flex: 1 1 520px; position: relative; overflow: hidden; background: #14213D; color: #FFFFFF; padding: 56px 64px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 48px; min-height: 560px">
    <svg aria-hidden="true" width="760" height="760" viewBox="0 0 760 760" style="position: absolute; right: -220px; bottom: -220px">
      <circle cx="380" cy="380" r="370" fill="#1B2C52"></circle>
      <circle cx="380" cy="380" r="280" fill="#203566"></circle>
      <circle cx="380" cy="380" r="190" fill="#25407A"></circle>
      <circle cx="380" cy="380" r="100" fill="#2F6FC0"></circle>
      <path d="M380 428s-30-26-30-49a30 30 0 0 1 60 0c0 23-30 49-30 49z" fill="#FFFFFF"></path>
      <circle cx="380" cy="378" r="10" fill="#2F6FC0"></circle>
    </svg>

    <div style="position: relative; display: flex; align-items: center; gap: 14px">
      <span style="width: 44px; height: 44px; border-radius: 50%; background: #2F6FC0; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.1-7-11.5a7 7 0 0 1 14 0C19 14.9 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
      </span>
      <div style="display: flex; flex-direction: column; line-height: 1.1">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.16em; color: #E9A23B">CTCS</span>
        <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.01em">Beacon</span>
      </div>
    </div>

    <div style="position: relative; display: flex; flex-direction: column; gap: 20px; max-width: 520px">
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.2em; color: #E9A23B">DUTY OF CARE</span>
      <h1 style="margin: 0; font-size: 60px; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em">First to know.<br>First to act.</h1>
      <p style="margin: 0; font-size: 18px; line-height: 1.55; color: #C9D3E6">See which travelers an event touches, reach them in minutes, and know who is safe.</p>
    </div>

    <ul style="position: relative; list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 12px 28px; font-size: 14px; color: #C9D3E6">
      <li style="display: flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E9A23B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>Live risk feed</li>
      <li style="display: flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E9A23B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path></svg>Flight status</li>
      <li style="display: flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E9A23B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"></path><path d="M22 4 12 14l-3-3"></path></svg>Traveler check-ins</li>
    </ul>
  </section>

  <section style="flex: 1 1 440px; display: flex; align-items: center; justify-content: center; padding: 56px 32px; box-sizing: border-box; background: #FFFFFF">
    <form style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 24px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.01em; color: #14213D">Sign in</h2>
        <p style="margin: 0; font-size: 16px; color: #556072">Use your company account.</p>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="email" style="font-size: 14px; font-weight: 600; color: #14213D">Work email</label>
        <input id="email" type="email" placeholder="name@company.com" autocomplete="off" style="height: 48px; padding: 0 16px; border: 1px solid #B9C3D3; border-radius: 8px; font-size: 16px; font-family: inherit; color: #14213D; background: #FFFFFF; box-sizing: border-box">
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="password" style="font-size: 14px; font-weight: 600; color: #14213D">Password</label>
        <input id="password" type="password" placeholder="Enter your password" autocomplete="off" style="height: 48px; padding: 0 16px; border: 1px solid #B9C3D3; border-radius: 8px; font-size: 16px; font-family: inherit; color: #14213D; background: #FFFFFF; box-sizing: border-box">
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap">
        <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #3A4558; min-height: 44px"><input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: #1F5FAD">Keep me signed in</label>
        <a href="#" style="font-size: 14px; font-weight: 600; color: #1F5FAD; text-decoration: none; min-height: 44px; display: flex; align-items: center">Forgot password?</a>
      </div>

      <a href="Home.dc.html" style="height: 52px; border-radius: 8px; background: #1F5FAD; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Sign in</a>

      <div style="display: flex; align-items: center; gap: 12px; color: #6B7588; font-size: 13px">
        <span style="flex: 1; height: 1px; background: #DCE2EB"></span>or<span style="flex: 1; height: 1px; background: #DCE2EB"></span>
      </div>

      <a href="Home.dc.html" style="height: 52px; border-radius: 8px; border: 1px solid #14213D; color: #14213D; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; box-sizing: border-box">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        Sign in with company SSO
      </a>

      <a href="Map.dc.html" onClick="{{demo}}" style="min-height: 52px; padding: 8px 16px; border-radius: 8px; background: #FFF4E0; border: 1px solid #E9A23B; color: #14213D; text-decoration: none; display: flex; align-items: center; gap: 12px; box-sizing: border-box">
        <span aria-hidden="true" style="flex: none; width: 34px; height: 34px; border-radius: 50%; background: #E9A23B; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="#14213D"><path d="M7 4v16l13-8z"></path></svg></span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">Play the demo</span><span style="font-size: 13px; color: #3A4558">Watch Beacon handle an earthquake alert. About 20 seconds.</span></span>
      </a>

      <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 8px; border-top: 1px solid #E6EAF0">
        <p style="margin: 0; font-size: 13px; color: #556072">Need help? Contact your account manager.</p>
        <p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: #6B7588">PROTOTYPE · SAMPLE DATA · NO REAL SIGN-IN</p>
      </div>
    </form>
  </section>

</div>
</template>
<template id="tpl-Home">

<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F3F5F9; font-family: 'Open Sans', system-ui, sans-serif; color: #14213D">

  <nav aria-label="Main" style="flex: 1 1 236px; background: #14213D; color: #FFFFFF; padding: 28px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 32px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 0 8px">
      <span style="width: 38px; height: 38px; border-radius: 50%; background: #2F6FC0; display: flex; align-items: center; justify-content: center; flex: none">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.1-7-11.5a7 7 0 0 1 14 0C19 14.9 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
      </span>
      <div style="display: flex; flex-direction: column; line-height: 1.1">
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: #E9A23B">CTCS</span>
        <span style="font-size: 19px; font-weight: 800">Beacon</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 8px; margin-top: -12px">
      <span style="font-size: 15px; font-weight: 700; color: #FFFFFF">Acme Corp</span>
      <select aria-label="Sub company" value="{{navSub}}" onChange="{{onNavSub}}" style="height: 40px; width: 100%; padding: 0 10px; border: 1px solid #5B6C94; border-radius: 8px; background: #1D2C50; color: #FFFFFF; font-size: 14px; font-weight: 600; font-family: inherit">
        <option value="all" style="color: #14213D; background: #FFFFFF">All sub companies</option>
        <option value="Acme-US" style="color: #14213D; background: #FFFFFF">Acme-US</option>
        <option value="Acme-Europe" style="color: #14213D; background: #FFFFFF">Acme-Europe</option>
        <option value="Acme-Asia Pacific" style="color: #14213D; background: #FFFFFF">Acme-Asia Pacific</option>
        <option value="Acme-Latin America" style="color: #14213D; background: #FFFFFF">Acme-Latin America</option>
      </select>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <a href="Home.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; background: #26385F; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 700">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E9A23B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
      <a href="Travelers.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #C9D3E6; text-decoration: none; font-size: 15px; font-weight: 600">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"></path></svg>Travelers</a>
      <a href="Alerts.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #C9D3E6; text-decoration: none; font-size: 15px; font-weight: 600">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4M12 17h.01"></path></svg>Alerts</a>
      <a href="Map.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #C9D3E6; text-decoration: none; font-size: 15px; font-weight: 600">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"></path><path d="M9 4v14M15 6v14"></path></svg>Map</a>
      <a href="DailyBrief.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #C9D3E6; text-decoration: none; font-size: 15px; font-weight: 600">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6M8 13h8M8 17h5"></path></svg>Daily Brief</a>
      <a href="PreTravel.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #C9D3E6; text-decoration: none; font-size: 15px; font-weight: 600">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg>Pre-Travel Brief</a>
      <a href="Legend.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #C9D3E6; text-decoration: none; font-size: 15px; font-weight: 600">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h.01M4 12h.01M4 18h.01M9 6h11M9 12h11M9 18h11"></path></svg>Legend</a>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px; padding: 16px 8px 0; border-top: 1px solid #2B3D66">
      <a href="Preferences.dc.html" aria-label="Open preferences" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 8px; margin: 0 -8px; border-radius: 8px; color: #FFFFFF; text-decoration: none">
        <span style="width: 36px; height: 36px; border-radius: 50%; background: #E9A23B; color: #14213D; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: none">AM</span>
        <div style="display: flex; flex-direction: column; line-height: 1.3">
          <span style="font-size: 14px; font-weight: 700">Alex Morgan</span>
          <span style="font-size: 12px; color: #AEBBD3">Travel manager · Acme Corp</span>
        </div>
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9D3E6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left: auto; flex: none"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
      </a>
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; color: #C9D3E6; text-decoration: none; font-size: 14px; font-weight: 600">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>Sign out</a>

  <main style="flex: 999 1 560px; min-width: 0; padding: 32px 40px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px; max-width: 1280px">

    <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 20px; font-weight: 800; color: #1F5FAD">{{account}}</span>
        <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.01em">Good morning, Alex</h1>
        <p style="margin: 0; font-size: 14px; color: #556072">Tuesday, Dec 1 · 9:30 AM ET</p>
      </div>
    </header>

    <section aria-label="At a glance" style="display: flex; flex-wrap: wrap; gap: 16px">

      <a href="Travelers.dc.html" onClick="{{goAll}}" style="background: #FFFFFF; border: 1px solid #E1E6EE; border-radius: 12px; padding: 18px; text-decoration: none; color: #14213D; display: flex; flex-direction: column; gap: 10px; flex: 0 1 250px; box-sizing: border-box">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
          <span style="font-size: 14px; font-weight: 700; color: #3A4558">Travelers traveling now</span>
          <span style="width: 32px; height: 32px; border-radius: 50%; background: #E3ECF8; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F5FAD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"></path></svg></span>
        </div>
        <span style="font-size: 34px; font-weight: 800; line-height: 1">{{awayNow}}</span>
        <span style="margin-top: auto; padding-top: 4px; font-size: 13px; font-weight: 700; color: #1F5FAD">Open the travelers report →</span>
      </a>

      <a href="Travelers.dc.html" onClick="{{goRisk}}" style="background: #FFFFFF; border: 1px solid #E1E6EE; border-radius: 12px; padding: 18px; text-decoration: none; color: #14213D; display: flex; flex-direction: column; gap: 10px; flex: 0 1 250px; box-sizing: border-box">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
          <span style="font-size: 14px; font-weight: 700; color: #3A4558">Travelers near Extreme, High, or Medium alerts</span>
          <span style="width: 32px; height: 32px; border-radius: 50%; background: #FCE9DF; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B23C0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.1-7-11.5a7 7 0 0 1 14 0C19 14.9 12 21 12 21z"></path><path d="M12 7v4M12 14h.01"></path></svg></span>
        </div>
        <span style="font-size: 34px; font-weight: 800; line-height: 1; color: #B23C0A">{{nearRisk}}</span>
        <div style="display: flex; gap: 6px; flex-wrap: wrap">
          <span style="padding: 3px 8px; border-radius: 4px; background: #8F1D1D; color: #FFFFFF; font-size: 12px; font-weight: 700">{{tExtreme}} Extreme</span>
          <span style="padding: 3px 8px; border-radius: 4px; background: #B23C0A; color: #FFFFFF; font-size: 12px; font-weight: 700">{{tHigh}} High</span>
          <span style="padding: 3px 8px; border-radius: 4px; background: #F2C46B; color: #14213D; font-size: 12px; font-weight: 700">{{tMedium}} Medium</span>
        </div>
        <span style="margin-top: auto; padding-top: 4px; font-size: 13px; font-weight: 700; color: #1F5FAD">See these travelers →</span>
      </a>

      <a href="Alerts.dc.html" style="background: #FFFFFF; border: 1px solid #E1E6EE; border-radius: 12px; padding: 18px; text-decoration: none; color: #14213D; display: flex; flex-direction: column; gap: 10px; flex: 0 1 250px; box-sizing: border-box">

  <main style="{{mainStyle}}">

    <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
      <div style="display: flex; align-items: center; gap: 12px; min-width: 0">
        <button type="button" aria-label="{{menuLabel}}" aria-pressed="{{menuHidden}}" onClick="{{toggleMenu}}" style="height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid #B9C3D3; background: #FFFFFF; color: #14213D; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 8px; flex: none">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v14H3zM9 5v14"></path></svg>{{menuLabel}}
        </button>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.01em">Pre-Travel Brief</h1>
          <p style="margin: 0; font-size: 15px; color: #3A4558">What a traveler should know before they go.</p>
        </div>
      </div>
      <sc-if value="{{hasPlace}}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{download}}" style="min-height: 44px; padding: 0 18px; border-radius: 8px; border: 0; background: #1F5FAD; color: #FFFFFF; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 8px">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg>Download PDF
        </button>
      </sc-if>
    </header>

    <section aria-label="Choose a place" style="background: #FFFFFF; border: 1px solid #E1E6EE; border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
      <label for="psearch" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search for a country or major city</label>
      <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border: 1px solid #B9C3D3; border-radius: 8px; background: #FFFFFF; box-sizing: border-box">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#556072" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input id="psearch" type="search" value="{{q}}" onChange="{{onSearch}}" onKeyDown="{{onSearchKey}}" placeholder="Search for a country or major city, such as France or Tokyo" style="flex: 1; min-width: 0; border: 0; font-size: 16px; font-family: inherit; color: #14213D; background: transparent">
      </div>
      <sc-if value="{{hasMatches}}" hint-placeholder-val="{{ false }}">
        <div role="list" aria-label="Matching places" style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{matches}}" as="m" hint-placeholder-count="2">
            <button type="button" role="listitem" onClick="{{m.pick}}" style="min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid #1F5FAD; background: #E3ECF8; color: #14213D; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer">{{m.label}}</button>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{noMatch}}" hint-placeholder-val="{{ false }}">
        <p role="status" style="margin: 0; padding: 10px 14px; border-radius: 8px; background: #FFF4E0; border: 1px solid #E9A23B; font-size: 14px; color: #14213D">{{noMatchText}}</p>
      </sc-if>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
        <span style="font-size: 13px; font-weight: 700; color: #3A4558">Loaded in this prototype (6):</span>
        <sc-for list="{{loaded}}" as="p" hint-placeholder-count="6">
          <button type="button" aria-pressed="{{p.on}}" onClick="{{p.pick}}" style="{{p.style}}">{{p.name}}</button>
        </sc-for>
      </div>
    </section>

    <sc-if value="{{noPlace}}" hint-placeholder-val="{{ false }}">
      <section aria-label="No place chosen" style="background: #FFFFFF; border: 1px dashed #B9C3D3; border-radius: 14px; padding: 40px 24px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
        <svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#1F5FAD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg>
        <h2 style="margin: 0; font-size: 18px; font-weight: 800">Choose a place to see its brief</h2>
        <p style="margin: 0; font-size: 14px; color: #3A4558; max-width: 520px">Search above or pick one of the six places. Each brief covers the overview, the latest events, risks, entry and exit, health, security and local laws, and general information.</p>
      </section>
    </sc-if>

    <sc-if value="{{hasPlace}}" hint-placeholder-val="{{ false }}">
      <section aria-label="Place" style="display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px">
          <h2 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.01em">{{pName}}</h2>
          <span style="font-size: 15px; color: #3A4558">{{pSub}}</span>
        </div>

        <div role="list" aria-label="At a glance" style="display: flex; flex-wrap: wrap; gap: 14px">
          <div role="listitem" style="flex: 1 1 230px; background: #FFFFFF; border: 1px solid #E1E6EE; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
            <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #556072">State Department advisory</span>
            <span style="{{levelStyle}}">{{levelText}}</span>
            <span style="font-size: 13px; color: #3A4558">{{levelNote}}</span>
          </div>
          <div role="listitem" style="flex: 1 1 230px; background: #FFFFFF; border: 1px solid #E1E6EE; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #556072">Entry for U.S. citizens</span>
            <span style="font-size: 16px; font-weight: 700; line-height: 1.3">{{entryLine}}</span>
          </div>
        </div>

        <div style="background: #FFFFFF; border: 1px solid #E1E6EE; border-radius: 14px; overflow: hidden">
          <div role="tablist" aria-label="Brief sections" style="display: flex; flex-wrap: wrap; gap: 4px; padding: 10px 12px 0; border-bottom: 1px solid #E1E6EE; background: #F8F9FC">
            <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
              <button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.name}}</button>
            </sc-for>
          </div>
          <div role="tabpanel" aria-label="{{tabName}}" style="padding: 8px 24px 20px">
            <sc-if value="{{tabIsTable}}" hint-placeholder-val="{{ true }}">
            <div role="table" aria-label="{{tabName}}" style="display: flex; flex-direction: column">
              <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
                <div role="row" style="display: flex; flex-wrap: wrap; gap: 4px 20px; padding: 14px 0; border-bottom: 1px solid #EEF1F6">
                  <span role="rowheader" style="flex: 0 0 220px; font-size: 14px; font-weight: 700; color: #14213D">{{r.k}}</span>
                  <span role="cell" style="flex: 1 1 320px; font-size: 15px; line-height: 1.5; color: #14213D">{{r.v}}</span>
                </div>
              </sc-for>
            </div>
            </sc-if>
            <sc-if value="{{tabIsEvents}}" hint-placeholder-val="{{ false }}">
              <p style="margin: 14px 0 6px; font-size: 14px; color: #3A4558">{{evIntro}}</p>
              <ul aria-label="Latest events" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
                <sc-for list="{{events}}" as="e" hint-placeholder-count="2">
                  <li style="display: flex; flex-wrap: wrap; gap: 6px 20px; padding: 14px 0; border-bottom: 1px solid #EEF1F6">
                    <span style="flex: 0 0 220px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start"><span style="{{e.sevStyle}}">{{e.sev}}</span><span style="font-size: 13px; color: #3A4558">{{e.when}}</span></span>
                    <span style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; font-weight: 700; color: #14213D">{{e.title}}</span><span style="font-size: 14px; color: #3A4558">{{e.meta}}</span></span>
                  </li>
                </sc-for>
              </ul>
            </sc-if>
          </div>
        </div>

        <p style="margin: 0; padding: 12px 16px; border-radius: 10px; background: #FFF4E0; border: 1px solid #E9A23B; font-size: 14px; line-height: 1.45; color: #14213D"><strong>Sample content, not real travel advice.</strong> {{sourceNote}} Everything else in this brief was written for the demo. Before a real trip, check travel.state.gov and cdc.gov.</p>
        <sc-if value="{{hasNote}}" hint-placeholder-val="{{ false }}">
          <p role="status" style="margin: 0; font-size: 14px; color: #3A4558">{{note}}</p>
        </sc-if>
      </section>
    </sc-if>

    <p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: #6B7588">PROTOTYPE · SAMPLE DATA · NOT REAL TRAVEL ADVICE</p>
  </main>
</div>

window.BEACON_SCREENS = {};
window.BEACON_DCLogic = class DCLogic {
  constructor(props) { this.props = props || {}; }
  setState(patch) { if (!this.state) this.state = {}; Object.assign(this.state, patch); window.BEACON_SCHEDULE(); }

<script>
BEACON_SCREENS['Main'] = (function (DCLogic) {

class Component extends DCLogic {
  renderVals() {
    return { demo: function () { try { window.localStorage.setItem('beacon.demo', '1'); } catch (e) {} } };
  }
}

return Component;
})(BEACON_DCLogic);

BEACON_SCREENS['Home'] = (function (DCLogic) {

class Component extends DCLogic {
  // Sub company picked in the sidebar. Kept in browser storage so other screens can pick it up.
  navSub() {
    if (this._sub === undefined) {
      var v = 'all';
      try { v = window.localStorage.getItem('beacon.sub') || 'all'; } catch (e) {}
      this._sub = v;
    }
    return this._sub;
  }
  setNavSub(v) {
    this._sub = v;
    try { window.localStorage.setItem('beacon.sub', v); } catch (e) {}
    this.forceUpdate();
  }
  // Key locations (headquarters, offices). Company-wide in the real product; this prototype keeps them in the browser.
  keyLocs() {
    try { var v = JSON.parse(window.localStorage.getItem('beacon.keyLocs') || 'null'); if (v && v.length !== undefined) return v; } catch (e) {}
    return []; // none to start with: the user adds their own in Preferences
  }
  // Where a key location is: its exact coordinates when given, otherwise its city
  keyLocPlace(k, D) {
    var i, c = null;
    if (typeof k.lat === 'number' && typeof k.lng === 'number') {
      var best = null, bd = Infinity;
      for (i = 0; i < D.cities.length; i++) { var m = D.miles(k.lat, k.lng, D.cities[i][4], D.cities[i][5]); if (m < bd) { bd = m; best = D.cities[i]; } }

      return { lat: k.lat, lng: k.lng, country: best && bd <= 250 ? best[1] : '' };
    }
    for (i = 0; i < D.cities.length; i++) if (D.cities[i][0] === k.city) c = D.cities[i];
    return c ? { lat: c[4], lng: c[5], country: c[1] } : null;
  }

    if (!SCREENS[name]) name = 'Main';
    current = { name: name, inst: new SCREENS[name]({}) };
    app.textContent = '';
    draw();
    document.title = 'CTCS Beacon · ' + ({ Main: 'Sign in', DailyBrief: 'Daily Brief', Preferences: 'Preferences' }[name] || name);
    window.scrollTo(0, 0);
  }
  function go(name) {
    var h = HASH[name] || 'sign-in';
    if (location.hash.replace('#', '') === h) show(name); else { try { location.hash = h; } catch (e) { show(name); } }
  }
  window.addEventListener('hashchange', function () { show(ROUTES[location.hash.replace('#', '')] || 'Main'); });
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a') : null;
    if (!a) return;
    var href = a.getAttribute('href') || '', m = /^\/?([A-Za-z]+)\.dc\.html$/.exec(href);
    if (m) { e.preventDefault(); go(m[1]); }
    else if (href.charAt(0) === '#') e.preventDefault();
  });
  document.addEventListener('submit', function (e) { e.preventDefault(); });

  // ----- Saving files: use the host's save prompt when there is one, else a normal browser download
  window.beaconSave = function (filename, data) {
    // Any failure comes back as a rejected promise, so the screen can say that nothing was saved
    var direct = function () {
      try {
        var blob = data instanceof Blob ? data : new Blob([data]);
        var url = URL.createObjectURL(blob), a = document.createElement('a');
        a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
        return Promise.resolve('saved');
      } catch (e) { return Promise.reject(e); }
    };
    var api = (typeof claude !== 'undefined' && claude && typeof claude.use === 'function') ? claude : null;
    if (!api) return direct();
    try {
      return api.use('downloads').then(function (d) { return d ? d.save({ filename: filename, data: data }).then(function () { return 'saved'; }) : direct(); });
    } catch (e) { return Promise.reject(e); }
  };

  // ----- Daily Brief as a real one-page PDF
  window.beaconBriefPdf = function (day) {
    var lib = window.jspdf && window.jspdf.jsPDF;
    if (!lib) return Promise.reject(new Error('The PDF tool is not available'));
    var v = new SCREENS.Brief({ day: day }).renderVals();
    var doc = new lib({ unit: 'pt', format: 'letter' }), M = 36, W = 612, y;
    var SEV = { Extreme: [[143, 29, 29], 255], High: [[178, 60, 10], 255], Medium: [[242, 196, 107], 20], Moderate: [[251, 227, 181], 60], Low: [[227, 236, 248], 40] };
    var chip = function (sev, x, yy) {
      var c = SEV[sev] || SEV.Low;
      doc.setFillColor(c[0][0], c[0][1], c[0][2]); doc.roundedRect(x, yy - 10, 62, 15, 3, 3, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(c[1] === 255 ? 255 : 20, c[1] === 255 ? 255 : 33, c[1] === 255 ? 255 : 61);
      doc.text(sev, x + 31, yy + 0.5, { align: 'center' });
    };
    doc.setFillColor(20, 33, 61); doc.rect(0, 0, W, 78, 'F');
    doc.setTextColor(242, 196, 107); doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.text('CTCS BEACON', M, 32, { charSpace: 1.5 });
    doc.setTextColor(255, 255, 255); doc.setFontSize(23); doc.text('Daily Brief', M, 56);
    doc.setFontSize(12); doc.text(v.dateText, W - M, 38, { align: 'right' });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(220, 227, 240); doc.text('Global travel risk news · last 24 hours', W - M, 54, { align: 'right' });
    y = 108;
    if (!v.hasLead) { doc.setTextColor(58, 69, 88); doc.setFontSize(12); doc.text('No new alerts were reported in the last 24 hours.', W / 2, y + 30, { align: 'center' }); }
    else {
      doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(31, 95, 173); doc.text('TOP STORY', M, y, { charSpace: 1.2 }); y += 22;
      chip(v.leadSev, M, y); doc.setTextColor(20, 33, 61); doc.setFont('helvetica', 'bold'); doc.setFontSize(16.5); doc.text(v.leadTitle, M + 72, y + 2); y += 18;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(58, 69, 88); var ml = doc.splitTextToSize(v.leadMeta, W - 2 * M); doc.text(ml, M, y); y += ml.length * 12 + 4;
      doc.setFontSize(10.5); doc.setTextColor(20, 33, 61); var sl = doc.splitTextToSize(v.leadSummary, W - 2 * M); doc.text(sl, M, y, { lineHeightFactor: 1.4 }); y += sl.length * 14.7 + 16;
      if (v.hasMore) {
        doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(31, 95, 173); doc.text('MORE STORIES', M, y, { charSpace: 1.2 }); y += 7;
        doc.setDrawColor(20, 33, 61); doc.setLineWidth(1.5); doc.line(M, y, W - M, y); y += 20;
        v.stories.forEach(function (s) {
          chip(s.sev, M, y);
          doc.setTextColor(20, 33, 61); doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.text(s.title, M + 76, y + 1); y += 13;
          doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(58, 69, 88); var a = doc.splitTextToSize(s.meta, W - 2 * M - 76); doc.text(a, M + 76, y); y += a.length * 11 + 2;
          doc.setFontSize(9.8); doc.setTextColor(20, 33, 61); var b = doc.splitTextToSize(s.summary, W - 2 * M - 76); doc.text(b, M + 76, y, { lineHeightFactor: 1.35 }); y += b.length * 13.2 + 6;
          doc.setDrawColor(203, 211, 224); doc.setLineWidth(0.75); doc.line(M, y, W - M, y); y += 18;
        });
      }
    }
    doc.setDrawColor(203, 211, 224); doc.setLineWidth(0.75); doc.line(M, 750, W - M, 750);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(85, 96, 114);
    doc.text('Risk data: Riskline. Covers alerts reported in the 24 hours to 9:30 AM ET.', M, 764); doc.text('Prototype · sample data', W - M, 764, { align: 'right' });
    var iso = new Date(Date.UTC(2026, 1, 1) + day * 86400000).toISOString().slice(0, 10);
    return window.beaconSave('beacon-daily-brief-' + iso + '.pdf', doc.output('blob'));
  };

  // Pre-travel brief: one continuous document with every section
  window.beaconTravelPdf = function (p) {
    var lib = window.jspdf && window.jspdf.jsPDF; if (!lib) return Promise.reject(new Error('The PDF tool is not available'));
    var doc = new lib({ unit: 'pt', format: 'letter' }), M = 40, W = 612, H = 792, y, page = 1;
    var rgb = function (hex) { return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)]; };
    var foot = function () {
      doc.setDrawColor(203, 211, 224); doc.setLineWidth(0.75); doc.line(M, H - 44, W - M, H - 44);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(85, 96, 114);
      doc.text('Sample content for a prototype. Not real travel advice. Check travel.state.gov and cdc.gov before travel.', M, H - 30);
      doc.text('Page ' + page, W - M, H - 30, { align: 'right' });
    };
    var need = function (h) { if (y + h > H - 60) { foot(); doc.addPage(); page++; y = 56; } };
    doc.setFillColor(20, 33, 61); doc.rect(0, 0, W, 86, 'F');
    doc.setTextColor(242, 196, 107); doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.text('CTCS BEACON · PRE-TRAVEL BRIEF', M, 32, { charSpace: 1.2 });
    doc.setTextColor(255, 255, 255); doc.setFontSize(24); doc.text(p.name, M, 62);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(220, 227, 240); doc.text('Capital: ' + p.capital, W - M, 62, { align: 'right' });
    y = 112;
    var bg = rgb(p.color[0]), fg = rgb(p.color[1]), lt = 'Level ' + p.level + ' · ' + p.levelText;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
    var lw = doc.getTextWidth(lt) + 20;
    doc.setFillColor(bg[0], bg[1], bg[2]); doc.roundedRect(M, y - 13, lw, 20, 4, 4, 'F'); doc.setTextColor(fg[0], fg[1], fg[2]); doc.text(lt, M + 10, y + 1);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(58, 69, 88); doc.text('State Department advisory. ' + p.levelNote, M + lw + 10, y + 1);
    y += 24;
    doc.setFont('helvetica', 'bold'); doc.setTextColor(20, 33, 61); doc.text('Entry for U.S. citizens:', M, y); doc.setFont('helvetica', 'normal'); doc.text(p.entryLine, M + 122, y);
    y += 26;
    p.sections.forEach(function (sec) {
      need(60);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(31, 95, 173); doc.text(sec.name, M, y); y += 7;
      doc.setDrawColor(20, 33, 61); doc.setLineWidth(1.2); doc.line(M, y, W - M, y); y += 16;
      sec.rows.forEach(function (r) {
        doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
        var lines = doc.splitTextToSize(r[1], W - 2 * M - 150), kl;
        doc.setFont('helvetica', 'bold'); kl = doc.splitTextToSize(r[0], 138);
        var h = Math.max(lines.length, kl.length) * 13 + 8;
        need(h);
        doc.setTextColor(20, 33, 61); doc.text(kl, M, y);
        doc.setFont('helvetica', 'normal'); doc.text(lines, M + 150, y);
        y += h - 4;
        doc.setDrawColor(225, 230, 238); doc.setLineWidth(0.5); doc.line(M, y - 6, W - M, y - 6); y += 4;
      });
      y += 12;
    });
    foot();
    return window.beaconSave('beacon-pre-travel-brief-' + p.name.toLowerCase().replace(/[^a-z]+/g, '-') + '.pdf', doc.output('blob'));
  };

  window.BEACON_START = function () { show(ROUTES[location.hash.replace('#', '')] || 'Main'); };
})();

BEACON_START();
