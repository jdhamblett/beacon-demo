<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTCS Beacon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{font-family:'Open Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:#14213D;background:#F3F5F9}
a{color:#1F5FAD}a:hover{color:#14213D}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #1F5FAD;outline-offset:2px}
input[type=range]{accent-color:#1F5FAD}
@media (min-width: 820px){nav[aria-label="Main"]{position:sticky;top:0;height:100vh;align-self:flex-start;overflow-y:auto}}
@media print{nav,header{display:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl-Main">

<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #FFFFFF; font-family: 'Open Sans', system-ui, sans-serif; color: #14213D">

  <section style="flex: 1 1 520px; position: relative; overflow: hidden; background: #14213D; color: #FFFFFF; padding: 56px 64px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 48px; min-height: 560px">
    <svg aria-hidden="true" width="760" height="760" viewBox="0 0 760 760" style="position: absolute; right: -220px; bottom: -220px">
      <circle cx="380" cy="380" r="370" fill="#1B2C52"></circle>
      <circle cx="380" cy="380" r="280" fill="#203566"></circle>
      <circle cx="380" cy="380" r="190" fill="#25407A"></circle>
      <circle cx="380" cy="380" r="100" fill="#2F6FC0"></circle>
      <path d="M380 428s-30-26-30-49a30 30 0 0 1 60 0c0 23-30 49-30 49z" fill="#FFFFFF"></path>
      <circle cx="380" cy="378" r="10" fill="#2F6FC0"></circle>
    </svg>

    <div style="position: relative; display: flex; align-items: center; gap: 14px">
      <span style="width: 44px; height: 44px; border-radius: 50%; background: #2F6FC0; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.1-7-11.5a7 7 0 0 1 14 0C19 14.9 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
      </span>
      <div style="display: flex; flex-direction: column; line-height: 1.1">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.16em; color: #E9A23B">CTCS</span>
        <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.01em">Beacon</span>
      </div>
    </div>

    <div style="position: relative; display: flex; flex-direction: column; gap: 20px; max-width: 520px">
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.2em; color: #E9A23B">DUTY OF CARE</span>
      <h1 style="margin: 0; font-size: 60px; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em">First to know.<br>First to act.</h1>
      <p style="margin: 0; font-size: 18px; line-height: 1.55; color: #C9D3E6">See which travelers an event touches, reach them in minutes, and know who is safe.</p>
    </div>

    <ul style="position: relative; list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 12px 28px; font-size: 14px; color: #C9D3E6">
      <li style="display: flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E9A23B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>Live risk feed</li>
      <li style="display: flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E9A23B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path></svg>Flight status</li>
      <li style="display: flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E9A23B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"></path><path d="M22 4 12 14l-3-3"></path></svg>Traveler check-ins</li>
    </ul>
  </section>

  <section style="flex: 1 1 440px; display: flex; align-items: center; justify-content: center; padding: 56px 32px; box-sizing: border-box; background: #FFFFFF">
    <form style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 24px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.01em; color: #14213D">Sign in</h2>
        <p style="margin: 0; font-size: 16px; color: #556072">Use your company account.</p>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="email" style="font-size: 14px; font-weight: 600; color: #14213D">Work email</label>
        <input id="email" type="email" placeholder="name@company.com" autocomplete="off" style="height: 48px; padding: 0 16px; border: 1px solid #B9C3D3; border-radius: 8px; font-size: 16px; font-family: inherit; color: #14213D; background: #FFFFFF; box-sizing: border-box">
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="password" style="font-size: 14px; font-weight: 600; color: #14213D">Password</label>
        <input id="password" type="password" placeholder="Enter your password" autocomplete="off" style="height: 48px; padding: 0 16px; border: 1px solid #B9C3D3; border-radius: 8px; font-size: 16px; font-family: inherit; color: #14213D; background: #FFFFFF; box-sizing: border-box">
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap">
        <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #3A4558; min-height: 44px"><input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: #1F5FAD">Keep me signed in</label>
        <a href="#" style="font-size: 14px; font-weight: 600; color: #1F5FAD; text-decoration: none; min-height: 44px; display: flex; align-items: center">Forgot password?</a>
      </div>

      <a href="Home.dc.html" style="height: 52px; border-radius: 8px; background: #1F5FAD; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Sign in</a>

      <div style="display: flex; align-items: center; gap: 12px; color: #6B7588; font-size: 13px">
        <span style="flex: 1; height: 1px; background: #DCE2EB"></span>or<span style="flex: 1; height: 1px; background: #DCE2EB"></span>
      </div>

      <a href="Home.dc.html" style="height: 52px; border-radius: 8px; border: 1px solid #14213D; color: #14213D; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; box-sizing: border-box">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        Sign in with company SSO
      </a>

      <a href="Map.dc.html" onClick="{{demo}}" style="min-height: 52px; padding: 8px 16px; border-radius: 8px; background: #FFF4E0; border: 1px solid #E9A23B; color: #14213D; text-decoration: none; display: flex; align-items: center; gap: 12px; box-sizing: border-box">
        <span aria-hidden="true" style="flex: none; width: 34px; height: 34px; border-radius: 50%; background: #E9A23B; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="#14213D"><path d="M7 4v16l13-8z"></path></svg></span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">Play the demo</span><span style="font-size: 13px; color: #3A4558">Watch Beacon handle an earthquake alert. About 20 seconds.</span></span>
      </a>

      <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 8px; border-top: 1px solid #E6EAF0">
        <p style="margin: 0; font-size: 13px; color: #556072">Need help? Contact your account manager.</p>
        <p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: #6B7588">PROTOTYPE · SAMPLE DATA · NO REAL SIGN-IN</p>
      </div>
    </form>
  </section>

</div>
</template>
<template id="tpl-Home">

<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F3F5F9; font-family: 'Open Sans', system-ui, sans-serif; color: #14213D">

  <nav aria-label="Main" style="flex: 1 1 236px; background: #14213D; color: #FFFFFF; padding: 28px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 32px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 0 8px">
      <span style="width: 38px; height: 38px; border-radius: 50%; background: #2F6FC0; display: flex; align-items: center; justify-content: center; flex: none">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.1-7-11.5a7 7 0 0 1 14 0C19 14.9 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
      </span>
      <div style="display: flex; flex-direction: column; line-height: 1.1">
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: #E9A23B">CTCS</span>
        <span style="font-size: 19px; font-weight: 800">Beacon</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 8px; margin-top: -12px">
      <span style="font-size: 15px; font-weight: 700; color: #FFFFFF">Acme Corp</span>
      <select aria-label="Sub company" value="{{navSub}}" onChange="{{onNavSub}}" style="height: 40px; width: 100%; padding: 0 10px; border: 1px solid #5B6C94; border-radius: 8px; background: #1D2C50; color: #FFFFFF; font-size: 14px; font-weight: 600; font-family: inherit">
        <option value="all" style="color: #14213D; background: #FFFFFF">All sub companies</option>
        <option value="Acme-US" style="color: #14213D; background: #FFFFFF">Acme-US</option>
        <option value="Acme-Europe" style="color: #14213D; background: #FFFFFF">Acme-Europe</option>
        <option value="Acme-Asia Pacific" style="color: #14213D; background: #FFFFFF">Acme-Asia Pacific</option>
        <option value="Acme-Latin America" style="color: #14213D; background: #FFFFFF">Acme-Latin America</option>
      </select>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <a href="Home.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; background: #26385F; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 700">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E9A23B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
      <a href="Travelers.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #C9D3E6; text-decoration: none; font-size: 15px; font-weight: 600">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"></path></svg>Travelers</a>
      <a href="Alerts.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #C9D3E6; text-decoration: none; font-size: 15px; font-weight: 600">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4M12 17h.01"></path></svg>Alerts</a>
      <a href="Map.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #C9D3E6; text-decoration: none; font-size: 15px; font-weight: 600">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"></path><path d="M9 4v14M15 6v14"></path></svg>Map</a>
      <a href="DailyBrief.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #C9D3E6; text-decoration: none; font-size: 15px; font-weight: 600">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6M8 13h8M8 17h5"></path></svg>Daily Brief</a>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px; padding: 16px 8px 0; border-top: 1px solid #2B3D66">
      <a href="Preferences.dc.html" aria-label="Open preferences" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 8px; margin: 0 -8px; border-radius: 8px; color: #FFFFFF; text-decoration: none">
        <span style="width: 36px; height: 36px; border-radius: 50%; background: #E9A23B; color: #14213D; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: none">AM</span>
        <div style="display: flex; flex-direction: column; line-height: 1.3">
          <span style="font-size: 14px; font-weight: 700">Alex Morgan</span>
          <span style="font-size: 12px; color: #AEBBD3">Travel manager · Acme Corp</span>
        </div>
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9D3E6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left: auto; flex: none"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
      </a>
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; color: #C9D3E6; text-decoration: none; font-size: 14px; font-weight: 600">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>Sign out</a>
    </div>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; padding: 32px 40px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px; max-width: 1280px">

    <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 20px; font-weight: 800; color: #1F5FAD">{{account}}</span>
        <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.01em">Good morning, Alex</h1>
        <p style="margin: 0; font-size: 14px; color: #556072">Tuesday, Dec 1 · 9:30 AM ET</p>
      </div>
    </header>

    <section aria-label="At a glance" style="display: flex; flex-wrap: wrap; gap: 16px">

      <a href="Travelers.dc.html" onClick="{{goAll}}" style="background: #FFFFFF; border: 1px solid #E1E6EE; border-radius: 12px; padding: 18px; text-decoration: none; color: #14213D; display: flex; flex-direction: column; gap: 10px; flex: 0 1 250px; box-sizing: border-box">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
          <span style="font-size: 14px; font-weight: 700; color: #3A4558">Travelers traveling now</span>
          <span style="width: 32px; height: 32px; border-radius: 50%; background: #E3ECF8; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F5FAD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"></path></svg></span>
        </div>
        <span style="font-size: 34px; font-weight: 800; line-height: 1">{{awayNow}}</span>
        <span style="margin-top: auto; padding-top: 4px; font-size: 13px; font-weight: 700; color: #1F5FAD">Open the travelers report →</span>
      </a>

      <a href="Travelers.dc.html" onClick="{{goRisk}}" style="background: #FFFFFF; border: 1px solid #E1E6EE; border-radius: 12px; padding: 18px; text-decoration: none; color: #14213D; display: flex; flex-direction: column; gap: 10px; flex: 0 1 250px; box-sizing: border-box">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
          <span style="font-size: 14px; font-weight: 700; color: #3A4558">Travelers near Extreme, High, or Medium alerts</span>
          <span style="width: 32px; height: 32px; border-radius: 50%; background: #FCE9DF; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B23C0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.1-7-11.5a7 7 0 0 1 14 0C19 14.9 12 21 12 21z"></path><path d="M12 7v4M12 14h.01"></path></svg></span>
        </div>
        <span style="font-size: 34px; font-weight: 800; line-height: 1; color: #B23C0A">{{nearRisk}}</span>
        <div style="display: flex; gap: 6px; flex-wrap: wrap">
          <span style="padding: 3px 8px; border-radius: 4px; background: #8F1D1D; color: #FFFFFF; font-size: 12px; font-weight: 700">{{tExtreme}} Extreme</span>
          <span style="padding: 3px 8px; border-radius: 4px; background: #B23C0A; color: #FFFFFF; font-size: 12px; font-weight: 700">{{tHigh}} High</span>
          <span style="padding: 3px 8px; border-radius: 4px; background: #F2C46B; color: #14213D; font-size: 12px; font-weight: 700">{{tMedium}} Medium</span>
        </div>
        <span style="margin-top: auto; padding-top: 4px; font-size: 13px; font-weight: 700; color: #1F5FAD">See these travelers →</span>
      </a>

      <a href="Alerts.dc.html" style="background: #FFFFFF; border: 1px solid #E1E6EE; border-radius: 12px; padding: 18px; text-decoration: none; color: #14213D; display: flex; flex-direction: column; gap: 10px; flex: 0 1 250px; box-sizing: border-box">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
          <span style="font-size: 14px; font-weight: 700; color: #3A4558">Alerts</span>
          <span style="width: 32px; height: 32px; border-radius: 50%; background: #FDF1DC; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A5A0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4M12 17h.01"></path></svg></span>
        </div>
        <span style="font-size: 34px; font-weight: 800; line-height: 1">{{openAlerts}}</span>
        <div style="display: flex; gap: 6px; flex-wrap: wrap">
          <span style="padding: 3px 8px; border-radius: 4px; background: #8F1D1D; color: #FFFFFF; font-size: 12px; font-weight: 700">{{nExtreme}} Extreme</span>
          <span style="padding: 3px 8px; border-radius: 4px; background: #B23C0A; color: #FFFFFF; font-size: 12px; font-weight: 700">{{nHigh}} High</span>
          <span style="padding: 3px 8px; border-radius: 4px; background: #F2C46B; color: #14213D; font-size: 12px; font-weight: 700">{{nMedium}} Medium</span>
        </div>
        <span style="margin-top: auto; padding-top: 4px; font-size: 13px; font-weight: 700; color: #1F5FAD">Review alerts →</span>

  <main style="{{mainStyle}}">

    <sc-if value="{{listView}}" hint-placeholder-val="{{ true }}">
      <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
        <div style="display: flex; align-items: center; gap: 12px; min-width: 0">
        <button type="button" aria-label="{{menuLabel}}" aria-pressed="{{menuHidden}}" onClick="{{toggleMenu}}" style="height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid #B9C3D3; background: #FFFFFF; color: #14213D; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 8px; flex: none">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v14H3zM9 5v14"></path></svg>{{menuLabel}}
        </button>
        <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.01em">Alerts</h1>
      </div>
        <button type="button" onClick="{{exportCsv}}" style="min-height: 44px; padding: 0 18px; border-radius: 8px; border: 0; background: #1F5FAD; color: #FFFFFF; font-size: 14px; font-weight: 700; font-family: inherit; display: flex; align-items: center; gap: 8px; cursor: pointer">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="m7 10 5 5 5-5"></path><path d="M12 15V3"></path></svg>

      <section aria-label="Alert list" style="background: #FFFFFF; border: 1px solid #E1E6EE; border-radius: 14px; overflow: hidden">

          <label for="asearch" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search alerts</label>
          <div style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 18px; border: 1px solid #B9C3D3; border-radius: 10px; background: #FFFFFF; box-sizing: border-box">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#556072" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
            <input id="asearch" type="search" value="{{q}}" onChange="{{onSearch}}" placeholder="Search by alert, city, country, or risk type" style="flex: 1; min-width: 0; border: 0; font-size: 16px; font-family: inherit; color: #14213D; background: transparent">
          </div>

          <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
            <label for="aquick" style="font-size: 14px; font-weight: 700; color: #3A4558">Dates</label>
            <select id="aquick" value="{{preset}}" onChange="{{onPreset}}" style="height: 44px; min-width: 200px; padding: 0 12px; border: 1px solid #B9C3D3; border-radius: 8px; background: #FFFFFF; font-size: 14px; font-weight: 600; font-family: inherit; color: #14213D">
              <option value="active">Active now</option>
              <option value="last7">Last 7 days</option>
              <option value="last30">Last 30 days</option>
              <option value="custom">Custom range</option>
            </select>
            <sc-if value="{{notCustom}}" hint-placeholder-val="{{ true }}">
              <span style="font-size: 15px; font-weight: 600; color: #14213D">{{rangeText}}</span>
            </sc-if>
            <sc-if value="{{isCustom}}" hint-placeholder-val="{{ false }}">
              <label for="afrom" style="font-size: 14px; font-weight: 700; color: #3A4558">From</label>
              <input id="afrom" type="date" min="2026-01-22" max="2026-12-01" value="{{from}}" onChange="{{onFrom}}" style="height: 44px; padding: 0 12px; border: 1px solid #B9C3D3; border-radius: 8px; background: #FFFFFF; font-size: 14px; font-weight: 600; font-family: inherit; color: #14213D">
              <label for="ato" style="font-size: 14px; font-weight: 700; color: #3A4558">to</label>
              <input id="ato" type="date" min="2026-01-22" max="2026-12-01" value="{{to}}" onChange="{{onTo}}" style="height: 44px; padding: 0 12px; border: 1px solid #B9C3D3; border-radius: 8px; background: #FFFFFF; font-size: 14px; font-weight: 600; font-family: inherit; color: #14213D">
            </sc-if>
          </div>

          <div style="display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center">
            <select aria-label="Region" value="{{region}}" onChange="{{onRegion}}" style="height: 44px; flex: 0 1 220px; padding: 0 12px; border: 1px solid #B9C3D3; border-radius: 8px; background: #FFFFFF; font-size: 14px; font-weight: 600; font-family: inherit; color: #14213D">

              <option value="North America">North America</option>
              <option value="Latin America">Latin America</option>
              <option value="Europe">Europe</option>
              <option value="Middle East &amp; Africa">Middle East &amp; Africa</option>
              <option value="Asia Pacific">Asia Pacific</option>
            </select>
            <select aria-label="Risk type" value="{{riskType}}" onChange="{{onType}}" style="height: 44px; flex: 0 1 260px; padding: 0 12px; border: 1px solid #B9C3D3; border-radius: 8px; background: #FFFFFF; font-size: 14px; font-weight: 600; font-family: inherit; color: #14213D">
              <option value="all">All risk types</option>
              <option value="Political Disruption">Political Disruption</option>
              <option value="Conflict and Terrorism">Conflict and Terrorism</option>
              <option value="Demonstrations and Strikes">Demonstrations and Strikes</option>
              <option value="Crime">Crime</option>
              <option value="Natural/Weather">Natural/Weather</option>
              <option value="Health/Medical">Health/Medical</option>
              <option value="Travel Safety and Disruptions">Travel Safety and Disruptions</option>
            </select>
            <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px; font-weight: 600; color: #14213D; cursor: pointer"><input type="checkbox" checked="{{only}}" onChange="{{toggleOnly}}" style="width: 20px; height: 20px; margin: 0; accent-color: #1F5FAD">Only alerts with potentially impacted travelers</label>
          </div>

          <div role="group" aria-label="Risk level" style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">

            </sc-for>
          </div>

          <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap; min-height: 24px">

          </div>
        </div>

        <div style="overflow-x: auto">

            </div>

            <sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
              <div style="border-bottom: 1px solid #EEF1F5">
                <div style="display: grid; grid-template-columns: 88px minmax(200px, 2fr) minmax(120px, 1fr) minmax(120px, 0.9fr) minmax(80px, 0.6fr) minmax(120px, 0.8fr); gap: 16px; align-items: center; padding: 16px 24px">
                  <div><span style="{{r.chipStyle}}">{{r.sev}}</span></div>
                  <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0; align-items: flex-start">
                    <button type="button" aria-expanded="{{r.openStr}}" onClick="{{r.toggle}}" style="padding: 0; border: 0; background: transparent; font-family: inherit; font-size: 15px; font-weight: 700; color: #14213D; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 8px">{{r.title}}<span aria-hidden="true" style="font-size: 12px; color: #1F5FAD">{{r.caret}}</span></button>
                    <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #556072">
                      <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1F5FAD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"></path></svg>{{r.type}}
                    </span>
                  </div>
                  <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
                    <span style="font-size: 15px; font-weight: 600">{{r.city}}</span>
                    <span style="font-size: 13px; color: #556072">{{r.country}}</span>
                  </div>
                  <span style="font-size: 14px; color: #14213D">{{r.reported}}</span>
                  <div style="display: flex; flex-direction: column; gap: 2px">
                    <span style="font-size: 15px; font-weight: 600">{{r.ends}}</span>
                    <span style="{{r.statusStyle}}">{{r.status}}</span>
                  </div>
                  <div>
                    <sc-if value="{{r.hasTrav}}" hint-placeholder-val="{{ true }}">
                      <button type="button" onClick="{{r.open}}" style="min-height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid #1F5FAD; background: #FFFFFF; color: #1F5FAD; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; text-align: left">{{r.travText}}</button>
                    </sc-if>
                    <sc-if value="{{r.noTrav}}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; color: #6B7588">None</span></sc-if>
                  </div>
                </div>
                <sc-if value="{{r.isOpen}}" hint-placeholder-val="{{ false }}">
                  <div style="margin: 0 24px 16px 128px; padding: 16px 18px; border-radius: 10px; background: #F7F9FC; display: flex; flex-direction: column; gap: 10px; max-width: 760px">

                    <div style="display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; font-size: 13px; color: #556072">
                      <span>{{r.matchText}}</span>
                      <a href="#" style="font-size: 14px; font-weight: 700; color: #1F5FAD; min-height: 44px; display: flex; align-items: center">Full report on Riskline</a>
                    </div>
                  </div>
                </sc-if>
              </div>
            </sc-for>

            <sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">

              </div>
            </sc-if>
          </div>
        </div>
        <sc-if value="{{hasRows}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 24px; flex-wrap: wrap">
            <span style="font-size: 14px; color: #3A4558">{{pageText}}</span>

              <button type="button" disabled="{{nextOff}}" onClick="{{nextPage}}" style="{{nextStyle}}">Next</button>
            </div>
          </div>
        </sc-if>
      </section>
    </sc-if>

    <sc-if value="{{detailView}}" hint-placeholder-val="{{ false }}">

            <div style="display: flex; align-items: center; gap: 12px; min-width: 0">
        <button type="button" aria-label="{{menuLabel}}" aria-pressed="{{menuHidden}}" onClick="{{toggleMenu}}" style="height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid #B9C3D3; background: #FFFFFF; color: #14213D; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 8px; flex: none">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v14H3zM9 5v14"></path></svg>{{menuLabel}}
        </button>
        <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.01em">{{dTitle}}</h1>
      </div>
          </div>
          <p style="margin: 0; font-size: 14px; color: #556072">{{dMeta}}</p>
          <p style="margin: 0; font-size: 14px; line-height: 1.55; color: #14213D; max-width: 760px">{{dSummary}}</p>

        <button type="button" onClick="{{exportCsv}}" style="min-height: 44px; padding: 0 18px; border-radius: 8px; border: 0; background: #1F5FAD; color: #FFFFFF; font-size: 14px; font-weight: 700; font-family: inherit; display: flex; align-items: center; gap: 8px; cursor: pointer">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="m7 10 5 5 5-5"></path><path d="M12 15V3"></path></svg>
          Export CSV
        </button>

      <a href="Alerts.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #C9D3E6; text-decoration: none; font-size: 15px; font-weight: 600">

      <a href="Map.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; background: #26385F; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 700">

      <a href="DailyBrief.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #C9D3E6; text-decoration: none; font-size: 15px; font-weight: 600">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6M8 13h8M8 17h5"></path></svg>Daily Brief</a>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px; padding: 16px 8px 0; border-top: 1px solid #2B3D66">
      <a href="Preferences.dc.html" aria-label="Open preferences" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 8px; margin: 0 -8px; border-radius: 8px; color: #FFFFFF; text-decoration: none">
        <span style="width: 36px; height: 36px; border-radius: 50%; background: #E9A23B; color: #14213D; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: none">{{userInitials}}</span>

  <main style="{{mainStyle}}">
    <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
      <div style="display: flex; align-items: center; gap: 12px">
        <button type="button" aria-label="{{menuLabel}}" aria-pressed="{{menuHidden}}" onClick="{{toggleMenu}}" style="height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid #B9C3D3; background: #FFFFFF; color: #14213D; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 8px">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v14H3zM9 5v14"></path></svg>{{menuLabel}}
        </button>
        <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.01em">Map</h1>
      </div>
      <span style="font-size: 14px; color: #3A4558"><strong style="color: #14213D">{{nTravelers}}</strong> travelers · <strong style="color: #7C3AED">{{nAtRisk}}</strong> inside an alert area · <strong style="color: #14213D">{{nAlerts}}</strong> alerts</span>
    </header>

    <section aria-label="Map tools" style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
      <label for="msearch" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search the map</label>
      <div style="flex: 1 1 300px; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border: 1px solid #B9C3D3; border-radius: 8px; background: #FFFFFF; box-sizing: border-box">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#556072" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input id="msearch" type="search" value="{{q}}" onChange="{{onSearch}}" onKeyDown="{{onSearchKey}}" placeholder="Search by traveler name, airline, or flight number. Press Enter to zoom." style="flex: 1; min-width: 0; border: 0; font-size: 15px; font-family: inherit; color: #14213D; background: transparent">
      </div>
      <button type="button" aria-pressed="{{drawOn}}" onClick="{{toggleDraw}}" style="{{drawStyle}}">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17c-2-4 1-10 7-11s9 4 7 9-9 6-12 3"></path><path d="M5 17l-1 4 4-1"></path></svg>{{drawLabel}}
      </button>
      <button type="button" aria-expanded="{{advOn}}" onClick="{{toggleAdv}}" style="{{advStyle}}">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg>{{advLabel}}
      </button>
      <a href="Travelers.dc.html" onClick="{{goReport}}" style="min-height: 44px; padding: 0 14px; border-radius: 8px; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 8px; border: 0; background: #1F5FAD; color: #FFFFFF; text-decoration: none">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6M8 13h8M8 17h5"></path></svg>Traveler report · {{selCount}}
      </a>
    </section>

    <sc-if value="{{advOpen}}" hint-placeholder-val="{{ false }}">
      <section aria-label="Advanced filters" style="background: #FFFFFF; border: 1px solid #E1E6EE; border-radius: 14px; padding: 14px 18px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center">
        <span style="font-size: 14px; font-weight: 700; color: #3A4558">Advanced filters</span>
        <select aria-label="Region" value="{{fRegion}}" onChange="{{onRegion}}" style="height: 40px; flex: 0 1 220px; padding: 0 12px; border: 1px solid #B9C3D3; border-radius: 8px; background: #FFFFFF; font-size: 14px; font-weight: 600; font-family: inherit; color: #14213D">
          <option value="all">All regions</option>
          <option value="North America">North America</option>
          <option value="Latin America">Latin America</option>
          <option value="Europe">Europe</option>
          <option value="Middle East &amp; Africa">Middle East &amp; Africa</option>
          <option value="Asia Pacific">Asia Pacific</option>
        </select>
        <select aria-label="Department" value="{{fDept}}" onChange="{{onDept}}" style="height: 40px; flex: 0 1 220px; padding: 0 12px; border: 1px solid #B9C3D3; border-radius: 8px; background: #FFFFFF; font-size: 14px; font-weight: 600; font-family: inherit; color: #14213D">
          <option value="all">All departments</option>
          <option value="Account Management">Account Management</option>
          <option value="Engineering">Engineering</option>
          <option value="Executive">Executive</option>
          <option value="Finance">Finance</option>
          <option value="Human Resources">Human Resources</option>
          <option value="Legal">Legal</option>
          <option value="Marketing">Marketing</option>
          <option value="Operations">Operations</option>
          <option value="Product">Product</option>
          <option value="Sales">Sales</option>
        </select>
        <select aria-label="Trip status" value="{{fStatus}}" onChange="{{onStatus}}" style="height: 40px; flex: 0 1 220px; padding: 0 12px; border: 1px solid #B9C3D3; border-radius: 8px; background: #FFFFFF; font-size: 14px; font-weight: 600; font-family: inherit; color: #14213D">
          <option value="all">All trip statuses</option>
          <option value="Away now">Away now</option>
          <option value="Arrived today">Arrived today</option>
          <option value="Departed today">Departed today (in transit)</option>
          <option value="Departing today">Departing today</option>
          <option value="Returning today">Returning today</option>
          <option value="Day trip">Day trip</option>
        </select>
        <label style="display: flex; align-items: center; gap: 8px; min-height: 40px; font-size: 14px; font-weight: 600; color: #14213D; cursor: pointer"><input type="checkbox" checked="{{fVip}}" onChange="{{onVip}}" style="width: 18px; height: 18px; margin: 0; accent-color: #1F5FAD">VIP only</label>
        <label style="display: flex; align-items: center; gap: 8px; min-height: 40px; font-size: 14px; font-weight: 600; color: #14213D; cursor: pointer"><input type="checkbox" checked="{{fRisk}}" onChange="{{onRisk}}" style="width: 18px; height: 18px; margin: 0; accent-color: #1F5FAD">Only travelers inside an alert area</label>
        <button type="button" onClick="{{resetAdv}}" style="min-height: 40px; padding: 0; border: 0; background: transparent; color: #1F5FAD; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; text-decoration: underline">Reset</button>
      </section>
    </sc-if>

    <section aria-label="Map filters" style="background: #FFFFFF; border: 1px solid #E1E6EE; border-radius: 14px; padding: 14px 18px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center">
      <div role="group" aria-label="Risk level" style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
        <span style="font-size: 14px; font-weight: 700; color: #3A4558; padding-right: 4px">Risk level</span>
        <sc-for list="{{levelChips}}" as="l" hint-placeholder-count="6">
          <button type="button" aria-pressed="{{l.on}}" onClick="{{l.pick}}" style="{{l.style}}"><span aria-hidden="true" style="{{l.dotStyle}}"></span>{{l.label}}</button>
        </sc-for>
      </div>
      <select aria-label="Risk type" value="{{riskType}}" onChange="{{onType}}" style="height: 40px; flex: 0 1 250px; padding: 0 12px; border: 1px solid #B9C3D3; border-radius: 8px; background: #FFFFFF; font-size: 14px; font-weight: 600; font-family: inherit; color: #14213D">
        <option value="all">All risk types</option>
        <option value="Political Disruption">Political Disruption</option>
        <option value="Conflict and Terrorism">Conflict and Terrorism</option>
        <option value="Demonstrations and Strikes">Demonstrations and Strikes</option>
        <option value="Crime">Crime</option>
        <option value="Natural/Weather">Natural/Weather</option>
        <option value="Health/Medical">Health/Medical</option>
        <option value="Travel Safety and Disruptions">Travel Safety and Disruptions</option>
      </select>
      <label style="display: flex; align-items: center; gap: 8px; min-height: 40px; font-size: 14px; font-weight: 600; color: #14213D; cursor: pointer"><input type="checkbox" checked="{{showTravelers}}" onChange="{{toggleTravelers}}" style="width: 18px; height: 18px; margin: 0; accent-color: #1F5FAD">Travelers</label>
      <label style="display: flex; align-items: center; gap: 8px; min-height: 40px; font-size: 14px; font-weight: 600; color: #14213D; cursor: pointer"><input type="checkbox" checked="{{showAlerts}}" onChange="{{toggleAlerts}}" style="width: 18px; height: 18px; margin: 0; accent-color: #1F5FAD">Alerts</label>
    </section>

    <section aria-label="World map" style="position: relative; background: #CFDDEE; border: 1px solid #B9C3D3; border-radius: 14px; overflow: hidden">
      <svg ref="{{mapRef}}" role="img" aria-label="World map showing travelers and active alerts" viewBox="{{viewBox}}" preserveAspectRatio="xMidYMid slice" onMouseDown="{{down}}" onMouseMove="{{move}}" onMouseUp="{{up}}" onMouseLeave="{{leave}}" onDoubleClick="{{dbl}}" onTouchStart="{{tdown}}" onTouchMove="{{tmove}}" onTouchEnd="{{up}}" style="{{svgStyle}}">
        <rect x="-1000" y="-1000" width="3000" height="3000" fill="#CFDDEE"></rect>
        <sc-for list="{{countries}}" as="c" hint-placeholder-count="1">
          <path d="{{c.d}}" onMouseEnter="{{c.enter}}" style="{{c.style}}"></path>
        </sc-for>
        <sc-for list="{{zones}}" as="a" hint-placeholder-count="1">
          <circle cx="{{a.x}}" cy="{{a.y}}" r="{{a.r}}" style="{{a.style}}"></circle>
        </sc-for>
        <sc-if value="{{hasShapeLine}}" hint-placeholder-val="{{ false }}">
          <path d="{{shapeD}}" style="fill: #1F5FAD; fill-opacity: 0.1; stroke: #1F5FAD; stroke-width: 2.5px; stroke-dasharray: 7 5; vector-effect: non-scaling-stroke; stroke-linejoin: round; pointer-events: none"></path>
        </sc-if>
        <sc-for list="{{pins}}" as="a" hint-placeholder-count="1">
          <circle cx="{{a.x}}" cy="{{a.y}}" r="{{a.r}}" style="{{a.style}}"></circle>
        </sc-for>
        <sc-for list="{{icons}}" as="i" hint-placeholder-count="1">
          <path d="{{i.d}}" transform="{{i.transform}}" style="{{i.style}}"></path>
        </sc-for>
        <sc-for list="{{bubbles}}" as="b" hint-placeholder-count="1">
          <circle cx="{{b.x}}" cy="{{b.y}}" r="{{b.r}}" style="{{b.style}}"></circle>
        </sc-for>
        <sc-for list="{{texts}}" as="t" hint-placeholder-count="1">
          <text x="{{t.x}}" y="{{t.y}}" style="{{t.style}}">{{t.text}}</text>
        </sc-for>
      </svg>

      <sc-if value="{{tipOn}}" hint-placeholder-val="{{ false }}">
        <div role="tooltip" style="{{tipStyle}}">{{tipText}}</div>
      </sc-if>

      <sc-if value="{{demoOn}}" hint-placeholder-val="{{ false }}">
        <div role="status" aria-label="Demo" style="position: absolute; left: 16px; top: 16px; width: min(400px, 62%); background: #14213D; color: #FFFFFF; border-radius: 12px; padding: 14px 18px 16px; box-shadow: 0 10px 28px rgba(20,33,61,0.35); box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; z-index: 4">
          <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #E9A23B">{{demoKicker}}</span>
          <span style="font-size: 17px; font-weight: 700; line-height: 1.35">{{demoCap}}</span>
          <div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px">
            <sc-if value="{{demoRunning}}" hint-placeholder-val="{{ false }}">
              <button type="button" onClick="{{demoStop}}" style="min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #5B6C94; background: transparent; color: #FFFFFF; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer">Skip demo</button>
            </sc-if>
            <sc-if value="{{demoDone}}" hint-placeholder-val="{{ false }}">
              <button type="button" onClick="{{demoStop}}" style="min-height: 36px; padding: 0 14px; border-radius: 8px; border: 0; background: #E9A23B; color: #14213D; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer">Explore the app</button>
              <button type="button" onClick="{{demoPlay}}" style="min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #5B6C94; background: transparent; color: #FFFFFF; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer">Replay</button>
            </sc-if>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{popOpen}}" hint-placeholder-val="{{ false }}">
        <div role="dialog" aria-label="Alert details" style="{{popStyle}}">
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
            <span style="{{popSevStyle}}">{{popSev}}</span>
            <button type="button" aria-label="Close alert" onClick="{{popClose}}" style="width: 32px; height: 32px; margin: -6px -8px 0 0; border: 0; border-radius: 8px; background: transparent; color: #3A4558; font-size: 20px; line-height: 1; font-family: inherit; cursor: pointer">×</button>
          </div>
          <h2 style="margin: 0; font-size: 18px; font-weight: 800; color: #14213D; line-height: 1.25">{{popTitle}}</h2>
          <div style="display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: #3A4558">
            <span><strong style="color: #14213D">{{popType}}</strong> · {{popWhere}}</span>
            <span>Reported {{popReported}} · Est. end {{popEnds}}</span>
          </div>
          <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #14213D">{{popText}}</p>
          <sc-if value="{{popHasPeople}}" hint-placeholder-val="{{ false }}">
            <button type="button" onClick="{{popPeople}}" style="align-self: flex-start; min-height: 36px; padding: 0; border: 0; background: transparent; color: #6D28D9; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; text-decoration: underline">{{popCount}}</button>
          </sc-if>
          <sc-if value="{{popNoPeople}}" hint-placeholder-val="{{ false }}">
            <span style="font-size: 14px; color: #3A4558">{{popCount}}</span>
          </sc-if>
          <a href="{{popLink}}" target="_blank" rel="noopener" style="align-self: flex-start; min-height: 40px; padding: 0 14px; border-radius: 8px; background: #1F5FAD; color: #FFFFFF; font-size: 14px; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 8px">View full alert
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg>
          </a>
        </div>
      </sc-if>

      <sc-if value="{{panelOpen}}" hint-placeholder-val="{{ false }}">
        <aside aria-label="Traveler details" style="position: absolute; top: 0; right: 0; bottom: 0; width: min(360px, 86%); background: #FFFFFF; border-left: 1px solid #B9C3D3; box-shadow: -6px 0 18px rgba(20,33,61,0.16); display: flex; flex-direction: column; box-sizing: border-box">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 12px 12px 20px; border-bottom: 1px solid #E1E6EE">
            <div role="tablist" aria-label="Panel view" style="display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: #EEF1F6">
              <button type="button" role="tab" aria-selected="{{tabTravOn}}" onClick="{{pickTrav}}" style="{{tabTravStyle}}">{{tabTravLabel}}</button>
              <button type="button" role="tab" aria-selected="{{tabAlertOn}}" onClick="{{pickAlert}}" style="{{tabAlertStyle}}">{{tabAlertLabel}}</button>
            </div>
            <button type="button" aria-label="Close traveler details" onClick="{{panelClose}}" style="width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: #3A4558; font-size: 22px; line-height: 1; font-family: inherit; cursor: pointer">×</button>
          </div>
          <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 14px">
            <sc-if value="{{panelIsList}}" hint-placeholder-val="{{ false }}">
              <h2 style="margin: 0; font-size: 18px; font-weight: 800; color: #14213D">{{listTitle}}</h2>

                <input id="ptsearch" type="search" aria-label="Search these travelers" value="{{pTq}}" onChange="{{onPTq}}" placeholder="Search travelers" style="flex: 1 1 150px; min-width: 0; height: 40px; padding: 0 12px; border: 1px solid #B9C3D3; border-radius: 8px; background: #FFFFFF; font-size: 14px; font-family: inherit; color: #14213D; box-sizing: border-box">
                <select aria-label="Sort travelers" value="{{pTsort}}" onChange="{{onPTsort}}" style="flex: 1 1 130px; min-width: 0; height: 40px; padding: 0 8px; border: 1px solid #B9C3D3; border-radius: 8px; background: #FFFFFF; font-size: 14px; font-weight: 600; font-family: inherit; color: #14213D; box-sizing: border-box">
                  <option value="risk">At risk first</option>
                  <option value="az">Name A to Z</option>
                  <option value="za">Name Z to A</option>
                  <option value="status">Status</option>
                </select>
              </div>
